<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuestBar</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="app" class="frame">
    <header class="titlebar">
      <canvas id="hero-portrait" title="가방 열기"></canvas>
      <div class="hero-info">
        <div class="hero-name"><span class="name" id="hero-name">용사</span><span class="lv">Lv.<span id="hero-lv">1</span></span></div>
        <div class="bar xp" title="경험치"><i id="xp-fill"></i><span id="xp-text">0 / 60 EXP</span></div>
        <div class="hero-sub">
          <span class="gold" id="gold-wrap"><span id="gold-icon"></span><b id="gold">0</b>G</span>
          <span id="today-wrap"><span id="today-icon"></span>오늘 <b id="today-prog">0/0</b></span>
        </div>
      </div>
      <div class="win-btns">
        <button class="icon-btn" id="btn-pin" title="항상 위에 표시"></button>
        <button class="icon-btn" id="btn-min" title="최소화"></button>
        <button class="icon-btn" id="btn-close" title="숨기기 (트레이 아이콘·Ctrl+Alt+Q로 다시 열기)"></button>
      </div>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <main id="view"></main>
    <div id="toasts"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="widget.js"></script>
</body>
</html>
