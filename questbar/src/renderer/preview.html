<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuestBar 미리보기</title>
  <style>
    /* 개발용 미리보기: Electron 없이 브라우저에서 위젯 + 작업표시줄 전투를 한 화면에 띄운다 */
    :root { color-scheme: dark; } /* 위젯·전투 iframe과 맞춰야 iframe 배경이 투명하게 보인다 */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1726; }
    .desktop {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, #2b5f8a 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, #6a3f7a 0%, transparent 50%),
        linear-gradient(160deg, #183450, #0e1726);
    }
    .taskbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
      background: rgba(28, 30, 38, 0.92); border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .taskbar i { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.12); display: block; }
    .taskbar i:first-child { background: #4aa8ff; }
    .clock { position: absolute; right: 14px; color: #e6e9ef; font: 12px 'Segoe UI', sans-serif; text-align: right; line-height: 1.3; }
    iframe { position: absolute; border: 0; background: transparent; }
    #widget { top: 16px; right: 16px; width: 408px; height: 728px; max-height: calc(100% - 64px - 150px + 120px); }
    #battle { left: 0; right: 0; bottom: 48px; width: 100%; height: 190px; }
  </style>
  <script type="module">
    import { createWebBackend } from './shared/web-backend.js';
    window.questbarShared = createWebBackend();
    const params = new URLSearchParams(location.search);
    const frames = { widget: './widget/index.html', battle: './battle/index.html' };
    for (const [id, src] of Object.entries(frames)) {
      if (params.get(id) === '0') { document.getElementById(id).remove(); continue; }
      document.getElementById(id).src = src;
    }
    const tick = () => {
      const d = new Date();
      document.querySelector('.clock').innerHTML = `${d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}<br>${d.toLocaleDateString('ko-KR')}`;
    };
    tick();
    setInterval(tick, 10000);
  </script>
</head>
<body>
  <div class="desktop"></div>
  <iframe id="battle" title="전투" allowtransparency="true"></iframe>
  <iframe id="widget" title="위젯" allowtransparency="true"></iframe>
  <div class="taskbar"><i></i><i></i><i></i><i></i><i></i><div class="clock"></div></div>
</body>
</html>
